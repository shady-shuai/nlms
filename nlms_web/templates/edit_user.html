<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit User</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center px-4">
      <h1 class="text-2xl font-bold">Edit User</h1>
      <a href="/manage-users" class="text-blue-500 hover:underline">← Back</a>
    </div>
  </header>

  <div class="max-w-md mx-auto my-8 bg-white p-6 rounded shadow">
    <form method="post" action="">
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Name</label>
        <input type="text" name="name" value="{{ user[1] }}"
               class="w-full border px-3 py-2 rounded" required>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Email</label>
        <input type="email" name="email" value="{{ user[2] }}"
               class="w-full border px-3 py-2 rounded" required>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Phone</label>
        <input type="text" name="phone" value="{{ user[3] }}"
               class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Role</label>
        <select name="role" class="w-full border px-3 py-2 rounded">
          {% for r in ['student','teacher','regular','admin'] %}
            <option value="{{ r }}"
              {% if user[4] == r %}selected{% endif %}>
              {{ r.capitalize() }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="flex justify-end">
        <button type="submit"
                class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          Save
        </button>
      </div>
    </form>
  </div>
</body>
</html>
