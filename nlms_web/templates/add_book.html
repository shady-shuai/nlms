<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center px-4">
      <h1 class="text-2xl font-bold">Add New Book</h1>
      <a href="/books" class="text-blue-500 hover:underline">← Back</a>
    </div>
  </header>

  <div class="max-w-md mx-auto my-8 bg-white p-6 rounded shadow">
    <form method="post" action="">
      <!-- 书籍基本信息 -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Title *</label>
        <input type="text" name="title" required
               class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">ISBN *</label>
        <input type="text" name="isbn" required
               class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Publisher *</label>
        <input type="text" name="publisher" required
               class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Publication Year *</label>
        <input type="number" name="year" min="0" required
               class="w-full border px-3 py-2 rounded">
      </div>

      <!-- 分类：选择或新建 -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Category</label>
        <select name="category"
                class="w-full border px-3 py-2 rounded mb-2">
          <option value="">-- Select Existing --</option>
          {% for cid, cname in categories %}
            <option value="{{ cid }}">{{ cname }}</option>
          {% endfor %}
        </select>
        <input type="text" name="new_category" placeholder="Or enter new category"
               class="w-full border px-3 py-2 rounded">
      </div>

      <!-- 作者：多选或新建 -->
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Authors</label>
        <select name="authors" multiple
                class="w-full border px-3 py-2 rounded h-32 mb-2">
          {% for aid, aname in authors %}
            <option value="{{ aid }}">{{ aname }}</option>
          {% endfor %}
        </select>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 font-semibold">New Authors First Names (one per line)</label>
            <textarea name="new_authors_first"
                      class="w-full border px-3 py-2 rounded h-24"
                      placeholder="e.g. John\nAlice"></textarea>
          </div>
          <div>
            <label class="block mb-1 font-semibold">New Authors Last Names (one per line)</label>
            <textarea name="new_authors_last"
                      class="w-full border px-3 py-2 rounded h-24"
                      placeholder="e.g. Doe\nSmith"></textarea>
          </div>
        </div>
        <p class="text-sm text-gray-500 mt-1">
          Lines correspond: first line’s first name with first line’s last name, etc.
        </p>
      </div>

      <div class="flex justify-end">
        <button type="submit"
                class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          Add Book
        </button>
      </div>
    </form>
  </div>
</body>
</html>
